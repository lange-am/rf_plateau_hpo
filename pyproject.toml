[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-plateau-hpo"
dynamic = ["version"]
description = "Adaptive n_estimators tuning for Random Forest: triplet-based OOB plateau search integrated with Optuna/TPE"
readme = "README.md"

# Python 3.8 remains supported and is covered by CI.
requires-python = ">=3.8"

license = { text = "MIT" }
authors = [
  { name = "Andrey M. Lange" },
]
maintainers = [{ name = "Andrey M. Lange" }]
keywords = [
  "random forest",
  "n_estimators",
  "number of trees",
  "ensemble size",
  "forest size",
  "plateau search",
  "out-of-bag",
  "oob score",
  "hyperparameter optimization",
  "hyperparameter tuning",
  "Optuna",
  "TPE",
  "Hyperband",
  "BOHB",
  "multi-fidelity optimization",
  "scikit-learn",
  "AutoML",
  "machine learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

# Runtime lower bounds let pip select versions compatible with the user's Python.
# Reproduction-oriented compatibility bounds are available in the "repro" extra.
dependencies = [
  "numpy>=1.21",
  "pandas>=1.4",
  # scikit-learn 1.3 introduced callable oob_score on RandomForest, which the
  # regression path in core.py relies on. It is also the last release that
  # supports Python 3.8, so this bound and requires-python agree.
  "scikit-learn>=1.3",
  "optuna>=3.1",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/lange-am/rf_plateau_hpo"
"Project page" = "https://lange-am.github.io/rf_plateau_hpo/"
"Conda-forge" = "https://anaconda.org/conda-forge/rf-plateau-hpo"
Documentation = "https://github.com/lange-am/rf_plateau_hpo#readme"
Repository = "https://github.com/lange-am/rf_plateau_hpo"
"Paper (IEEE Access)" = "https://doi.org/10.1109/ACCESS.2026.3705574"
"Preprint (arXiv)" = "https://arxiv.org/abs/2606.03549"
"Theory (arXiv)" = "https://arxiv.org/abs/2606.30837"
"Archive (Zenodo)" = "https://doi.org/10.5281/zenodo.22847391"
"Bug Tracker" = "https://github.com/lange-am/rf_plateau_hpo/issues"

[project.optional-dependencies]
# Compatibility bounds for reproducing the IEEE Access experiments.
# This dependency generation may not resolve on the newest Python releases.
repro = [
  "numpy>=1.21,<2.0",
  "pandas>=1.4,<2.2",
  "scikit-learn>=1.3,<1.4",
  "optuna>=3.1,<3.6",
]

# Minimal set needed to run the test suite. CI installs this rather than
# "dev", so that a notebook-only dependency cannot affect the test result.
test = [
  "pytest>=7.0",
]

# Everything needed to run notebooks/ and reproduce the figures and tables.
dev = [
  # Data sources (optional)
  "kaggle>=1.6.0",
  "ucimlrepo>=0.0.7",
  # Notebooks and kernel support
  "jupyterlab>=4.0",
  "notebook>=7.0",
  "ipykernel>=6.0",
  # Experiment persistence / progress / analysis / plotting
  "dill>=0.3.8",
  "tqdm>=4.66",
  "scipy>=1.7",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  # For parquet/xlsx/xls/arff
  "pyarrow>=14",
  "openpyxl>=3.1",
  # xlrd 2.0 dropped .xls support; the dataset loader still needs it.
  "xlrd<2.0",
  "liac-arff>=2.5",
  # Testing
  "pytest>=7.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "rf_plateau_hpo._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["rf_plateau_hpo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
