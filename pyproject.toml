[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-plateau-hpo"
version = "0.1.0"
# This one-line summary is what PyPI shows in search results. Keep the key
# terms ("Random Forest", "n_estimators", "number of trees", "Optuna") in it.
description = "Adaptive n_estimators tuning for Random Forest: triplet-based OOB plateau search integrated with Optuna/TPE"
readme = "README.md"

# Python 3.8 is kept: nothing in the code base needs anything newer, and every
# dependency below still resolves there (scikit-learn 1.3.2, pandas 2.0.3,
# numpy 1.24.4). Dropping it would only inconvenience users on older cluster
# environments. CI runs the test suite on 3.8 so this stays a checked claim.
requires-python = ">=3.8"

license = { text = "MIT" }
authors = [
  { name = "Andrey M. Lange" },
  { name = "Vadim A. Porvatov" },
  { name = "Andrey A. Dukhovny" },
]
maintainers = [{ name = "Andrey M. Lange" }]
keywords = [
  "random forest",
  "n_estimators",
  "number of trees",
  "ensemble size",
  "forest size",
  "plateau search",
  "out-of-bag",
  "oob score",
  "hyperparameter optimization",
  "hyperparameter tuning",
  "Optuna",
  "TPE",
  "Hyperband",
  "BOHB",
  "multi-fidelity optimization",
  "scikit-learn",
  "AutoML",
  "machine learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

# With lower bounds only, pip picks whatever fits the user's Python:
# scikit-learn 1.3.2 on Python 3.8, scikit-learn 1.8 on Python 3.13.
# The exact versions used for the paper are preserved in the "repro" extra.
#
# Verified working: numpy 2.4, pandas 3.0, scikit-learn 1.8, Optuna 5.0.
dependencies = [
  "numpy>=1.21",
  "pandas>=1.4",
  # scikit-learn 1.3 introduced callable oob_score on RandomForest, which the
  # regression path in core.py relies on. It is also the last release that
  # supports Python 3.8, so this bound and requires-python agree.
  "scikit-learn>=1.3",
  "optuna>=3.1",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/lange-am/rf_plateau_hpo"
Documentation = "https://github.com/lange-am/rf_plateau_hpo#readme"
Repository = "https://github.com/lange-am/rf_plateau_hpo"
"Paper (IEEE Access)" = "https://doi.org/10.1109/ACCESS.2026.3705574"
"Preprint (arXiv)" = "https://arxiv.org/abs/2606.03549"
"Theory (arXiv)" = "https://arxiv.org/abs/2606.30837"
"Archive (Zenodo)" = "https://doi.org/10.5281/zenodo.22847391"
"Bug Tracker" = "https://github.com/lange-am/rf_plateau_hpo/issues"

[project.optional-dependencies]
# Versions used to produce the results reported in the IEEE Access paper.
# These require Python <= 3.12: numpy 1.x, pandas 2.1 and scikit-learn 1.3
# publish no wheels for 3.13.
repro = [
  "numpy>=1.21,<2.0",
  "pandas>=1.4,<2.2",
  "scikit-learn>=1.3,<1.4",
  "optuna>=3.1,<3.6",
]

# Minimal set needed to run the test suite. CI installs this rather than
# "dev", so a heavy notebook dependency can never turn the badge red.
test = [
  "pytest>=7.0",
]

# Everything needed to run notebooks/ and reproduce the figures and tables.
# Lower bounds only, for the same reason as the runtime dependencies: this
# set resolves on every Python from 3.8 to 3.14.
dev = [
  # Data sources (optional)
  "kaggle>=1.6.0",
  "ucimlrepo>=0.0.7",
  # Notebooks and kernel support
  "jupyterlab>=4.0",
  "notebook>=7.0",
  "ipykernel>=6.0",
  # Experiment persistence / progress / analysis / plotting
  "dill>=0.3.8",
  "tqdm>=4.66",
  "scipy>=1.7",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  # For parquet/xlsx/xls/arff
  "pyarrow>=14",
  "openpyxl>=3.1",
  # xlrd 2.0 dropped .xls support, which the dataset loader still needs.
  # This cap is deliberate, unlike the ones removed above.
  "xlrd<2.0",
  "liac-arff>=2.5",
  # Testing
  "pytest>=7.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["rf_plateau_hpo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
