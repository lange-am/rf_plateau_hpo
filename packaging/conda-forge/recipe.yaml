schema_version: 1

context:
  name: rf-plateau-hpo
  version: "0.1.2"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rf-plateau-hpo/rf_plateau_hpo-${{ version }}.tar.gz
  sha256: f31eb5e552f3767c41a07982d9e216a12f20559b75166cf414834d8840a0f701

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.21
    - pandas >=1.4
    - scikit-learn >=1.3
    - optuna >=3.1
    - pyyaml >=6.0

tests:
  - python:
      imports:
        - rf_plateau_hpo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/lange-am/rf_plateau_hpo
  repository: https://github.com/lange-am/rf_plateau_hpo
  documentation: https://lange-am.github.io/rf_plateau_hpo/
  license: MIT
  license_file: LICENSE
  summary: Adaptive n_estimators tuning for Random Forest via OOB plateau search and Optuna/TPE
  description: |
    rf-plateau-hpo implements triplet-based OOB plateau search for adaptive
    Random Forest ensemble-size selection while Optuna/TPE tunes the remaining
    Random Forest hyperparameters.

extra:
  recipe-maintainers:
    - lange-am
